<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#07090d" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Night City Net</title>
  <style>:root {
  color-scheme: dark;
  --bg: #07090d;
  --bg-elevated: #0b0f16;
  --panel: rgba(13, 18, 26, .94);
  --panel-2: rgba(17, 23, 33, .92);
  --panel-3: #121923;
  --line: rgba(125, 157, 184, .16);
  --line-strong: rgba(92, 226, 255, .34);
  --text: #edf5f8;
  --muted: #82909c;
  --muted-2: #56636e;
  --cyan: #51dff7;
  --cyan-soft: rgba(81, 223, 247, .14);
  --red: #ff4f61;
  --red-soft: rgba(255, 79, 97, .13);
  --yellow: #f5d95f;
  --yellow-soft: rgba(245, 217, 95, .13);
  --green: #70e5aa;
  --purple: #ae82ff;
  --shadow: 0 24px 80px rgba(0, 0, 0, .42);
  --header-h: 68px;
  --rail-w: 76px;
  --list-w: 356px;
  --details-w: 316px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  background:
    radial-gradient(circle at 85% 12%, rgba(81, 223, 247, .09), transparent 28%),
    radial-gradient(circle at 10% 88%, rgba(255, 79, 97, .08), transparent 32%),
    var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, textarea { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}
::selection { background: rgba(81, 223, 247, .28); }

.app-shell {
  width: 100%; height: 100%;
  display: grid;
  grid-template-columns: var(--rail-w) minmax(280px, var(--list-w)) minmax(0, 1fr) var(--details-w);
  padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
  position: relative;
}
.app-shell::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; opacity: .18;
  background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(to bottom, #000, transparent 78%);
}

.icon-button {
  min-width: 44px; min-height: 44px; border: 0; background: transparent; border-radius: 12px;
  display: inline-grid; place-items: center; cursor: pointer; transition: background 160ms var(--ease), color 160ms var(--ease), transform 160ms var(--ease);
}
.icon-button:hover { background: rgba(255,255,255,.055); }
.icon-button:active { transform: scale(.96); }
.icon-button[disabled] { opacity: .35; cursor: not-allowed; }
.icon { width: 21px; height: 21px; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.brand-rail {
  background: rgba(6, 9, 13, .92);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding: 14px 10px; gap: 12px;
  z-index: 5;
}
.brand-mark {
  width: 48px; height: 48px; display: grid; place-items: center; position: relative;
  color: var(--cyan); font-weight: 900; letter-spacing: -.08em; font-size: 15px;
  clip-path: polygon(15% 0, 100% 0, 100% 75%, 74% 100%, 0 100%, 0 22%);
  border: 1px solid var(--line-strong); background: linear-gradient(145deg, rgba(81,223,247,.14), rgba(81,223,247,.02));
  box-shadow: inset 0 0 20px rgba(81,223,247,.05), 0 0 25px rgba(81,223,247,.08);
}
.rail-nav { display: flex; flex-direction: column; gap: 6px; width: 100%; margin-top: 6px; }
.rail-button { width: 100%; color: var(--muted); position: relative; }
.rail-button.active { color: var(--cyan); background: var(--cyan-soft); }
.rail-button.active::before { content:""; position:absolute; left:-10px; top:11px; bottom:11px; width:2px; background:var(--cyan); box-shadow:0 0 12px var(--cyan); }
.rail-spacer { flex: 1; }
.avatar {
  width: 42px; height: 42px; flex: 0 0 auto; border-radius: 14px; display: grid; place-items: center;
  font-weight: 800; font-size: 12px; letter-spacing: .05em; color: #061014;
  background: linear-gradient(145deg, var(--cyan), #b4f5ff);
  box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 8px 26px rgba(0,0,0,.24);
}
.avatar.yellow { background: linear-gradient(145deg, var(--yellow), #fff3a3); color:#161207; }
.avatar.red { background: linear-gradient(145deg, var(--red), #ff9ba5); color:#19070a; }
.avatar.purple { background: linear-gradient(145deg, var(--purple), #cfb6ff); color:#11091d; }
.avatar.green { background: linear-gradient(145deg, var(--green), #b2ffd8); color:#07170f; }
.avatar.large { width: 76px; height: 76px; border-radius: 24px; font-size: 21px; }

.chat-list-panel {
  min-width: 0; border-right: 1px solid var(--line); background: rgba(10, 13, 19, .89);
  display: flex; flex-direction: column; z-index: 4; position:relative;
}
.list-header { height: var(--header-h); padding: 11px 15px 8px; display:flex; align-items:center; justify-content:space-between; }
.eyebrow { font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.16em; color:var(--cyan); text-transform:uppercase; }
.list-title { margin: 3px 0 0; font-size: 21px; letter-spacing: -.025em; }
.connection-pill { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; }
.connection-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 9px var(--green); }
.connection-pill.offline .connection-dot { background:var(--red); box-shadow:0 0 9px var(--red); }
.search-wrap { margin: 4px 14px 10px; position:relative; }
.search-wrap .icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:18px; color:var(--muted); }
.search-input {
  width:100%; height:42px; border:1px solid var(--line); border-radius:13px; color:var(--text); background:rgba(255,255,255,.035);
  padding:0 14px 0 42px; outline:none; transition:border 160ms var(--ease), background 160ms var(--ease);
}
.search-input:focus { border-color:var(--line-strong); background:rgba(81,223,247,.045); }
.filter-tabs { display:flex; gap:6px; padding:0 14px 10px; overflow-x:auto; scrollbar-width:none; }
.filter-tab { min-height:34px; padding:0 12px; border:1px solid transparent; border-radius:10px; background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap; font-size:12px; }
.filter-tab.active { color:var(--text); border-color:var(--line-strong); background:var(--cyan-soft); }
.chat-scroll { overflow:auto; padding:0 8px 92px; scrollbar-width:thin; scrollbar-color:rgba(81,223,247,.18) transparent; }
.chat-item {
  width:100%; border:0; background:transparent; display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:11px; align-items:center;
  padding:11px 9px; border-radius:14px; color:var(--text); text-align:left; cursor:pointer; position:relative; transition:background 150ms var(--ease);
}
.chat-item:hover { background:rgba(255,255,255,.035); }
.chat-item.active { background:linear-gradient(90deg, rgba(81,223,247,.11), rgba(81,223,247,.025)); }
.chat-item.active::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:2px; background:var(--cyan); box-shadow:0 0 10px var(--cyan); }
.chat-main { min-width:0; }
.chat-line { display:flex; align-items:center; gap:7px; min-width:0; }
.chat-name { font-size:14px; font-weight:700; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.type-chip { font:700 8px/1 ui-monospace,monospace; letter-spacing:.08em; color:var(--muted); border:1px solid var(--line); padding:3px 5px; border-radius:5px; }
.chat-preview { margin-top:5px; color:var(--muted); font-size:12px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.chat-meta { align-self:stretch; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:8px; color:var(--muted-2); font-size:10px; }
.unread { min-width:19px; height:19px; padding:0 6px; border-radius:10px; display:grid; place-items:center; color:#061014; background:var(--cyan); font-weight:900; font-size:10px; }

.conversation-panel { min-width:0; display:flex; flex-direction:column; position:relative; background:rgba(7,10,15,.76); }
.conversation-panel::before {
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.32;
  background:
    linear-gradient(115deg, transparent 0 47%, rgba(81,223,247,.025) 47.2% 47.5%, transparent 47.7%),
    radial-gradient(circle at 50% 18%, rgba(81,223,247,.055), transparent 31%);
}
.chat-header, .selection-header {
  min-height:var(--header-h); border-bottom:1px solid var(--line); background:rgba(8,12,18,.88); backdrop-filter:blur(18px);
  display:flex; align-items:center; padding:8px 13px; z-index:3; position:relative;
}
.mobile-back { display:none; }
.header-identity { min-width:0; display:flex; border:0; background:transparent; color:inherit; text-align:left; align-items:center; gap:11px; cursor:pointer; padding:3px 7px; border-radius:12px; }
.header-copy { min-width:0; }
.header-title { font-size:15px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.header-subtitle { margin-top:3px; color:var(--green); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.header-actions { display:flex; margin-left:auto; gap:2px; color:var(--muted); }
.selection-header { gap:3px; }
.selection-count { margin:0 8px; min-width:70px; }
.selection-count strong { display:block; font-size:16px; }
.selection-count span { color:var(--muted); font-size:10px; }
.selection-actions { margin-left:auto; display:flex; gap:2px; }

.pinned-bar { z-index:2; min-height:42px; border-bottom:1px solid var(--line); background:rgba(12,17,24,.86); display:flex; align-items:center; gap:10px; padding:7px 16px; font-size:11px; }
.pinned-accent { width:2px; height:25px; background:var(--yellow); box-shadow:0 0 8px rgba(245,217,95,.5); }
.pinned-copy { min-width:0; }
.pinned-label { color:var(--yellow); font:700 9px/1.2 ui-monospace,monospace; text-transform:uppercase; letter-spacing:.12em; }
.pinned-text { margin-top:3px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.messages-scroll { flex:1; min-height:0; overflow:auto; padding:24px clamp(12px, 3vw, 42px) 22px; position:relative; z-index:1; scrollbar-width:thin; scrollbar-color:rgba(81,223,247,.2) transparent; scroll-behavior:smooth; }
.day-divider { display:flex; align-items:center; gap:12px; margin:5px 0 22px; color:var(--muted-2); font:700 9px/1 ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
.day-divider::before,.day-divider::after { content:""; height:1px; flex:1; background:linear-gradient(90deg,transparent,var(--line),transparent); }
.message-row { display:flex; margin:7px 0; position:relative; border-radius:16px; outline:0; }
.message-row.own { justify-content:flex-end; }
.message-row.selected { background:rgba(81,223,247,.08); box-shadow:inset 2px 0 var(--cyan); }
.message-row.selected::after { content:"✓"; position:absolute; right:8px; top:8px; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:var(--cyan); color:#071014; font-size:11px; font-weight:900; }
.message-row.own.selected::after { left:8px; right:auto; }
.message-hit { max-width:min(72%, 680px); display:flex; gap:8px; align-items:flex-end; padding:2px; touch-action:pan-y; }
.message-avatar { width:28px; height:28px; border-radius:9px; font-size:9px; }
.message-bubble {
  min-width:70px; border:1px solid var(--line); background:rgba(17,23,33,.92); border-radius:16px 16px 16px 5px;
  padding:9px 11px 7px; box-shadow:0 12px 28px rgba(0,0,0,.16); position:relative;
}
.own .message-bubble { background:linear-gradient(145deg, rgba(18,43,51,.95), rgba(13,27,34,.96)); border-color:rgba(81,223,247,.22); border-radius:16px 16px 5px 16px; }
.message-author { color:var(--cyan); font-size:11px; font-weight:800; margin-bottom:5px; }
.message-text { font-size:14px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; }
.message-meta { display:flex; justify-content:flex-end; align-items:center; gap:6px; margin-top:5px; color:var(--muted-2); font-size:9px; }
.delivery { color:var(--cyan); letter-spacing:-.2em; margin-right:.2em; }
.reply-quote { border-left:2px solid var(--cyan); padding:5px 8px; margin-bottom:7px; color:var(--muted); background:rgba(81,223,247,.045); border-radius:0 7px 7px 0; font-size:11px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.system-message { margin:18px auto; max-width:80%; padding:6px 12px; border:1px solid var(--line); border-radius:8px; color:var(--muted); background:rgba(8,12,17,.72); font:600 9px/1.4 ui-monospace,monospace; letter-spacing:.07em; text-transform:uppercase; text-align:center; }
.media-card { min-width:220px; }
.media-preview { height:150px; border-radius:11px; overflow:hidden; position:relative; background:
  linear-gradient(145deg, rgba(81,223,247,.18), transparent 45%),
  linear-gradient(35deg, #111b27, #1d2b36 55%, #0e141c); border:1px solid rgba(255,255,255,.05); }
.media-preview::before { content:"NCN // VISUAL FEED"; position:absolute; left:12px; top:12px; color:rgba(255,255,255,.6); font:700 9px ui-monospace,monospace; letter-spacing:.1em; }
.media-preview::after { content:""; position:absolute; inset:20% 12%; border:1px solid rgba(81,223,247,.28); clip-path:polygon(0 0,100% 0,100% 72%,86% 100%,0 100%); }
.media-caption { margin-top:8px; font-size:13px; }
.file-card { display:flex; align-items:center; gap:11px; min-width:220px; }
.file-icon { width:42px; height:42px; border:1px solid var(--line-strong); color:var(--cyan); display:grid; place-items:center; border-radius:12px; background:var(--cyan-soft); }
.file-name { font-size:12px; font-weight:700; }
.file-size { color:var(--muted); font-size:10px; margin-top:3px; }
.voice-card { min-width:230px; display:flex; align-items:center; gap:10px; }
.voice-play { width:36px; height:36px; border:0; border-radius:50%; background:var(--cyan); color:#071014; display:grid; place-items:center; }
.waveform { flex:1; height:28px; display:flex; gap:2px; align-items:center; }
.waveform span { width:2px; border-radius:2px; background:linear-gradient(to top,var(--cyan),rgba(81,223,247,.25)); }
.voice-duration { font:700 10px ui-monospace,monospace; color:var(--muted); }
.reactions { display:flex; gap:5px; flex-wrap:wrap; margin-top:7px; }
.reaction { border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.035); color:var(--muted); padding:3px 7px; font-size:10px; }

.composer-wrap { z-index:3; position:relative; padding:10px clamp(10px, 2vw, 22px) calc(10px + var(--safe-bottom)); border-top:1px solid var(--line); background:rgba(8,12,17,.9); backdrop-filter:blur(18px); }
.reply-draft { display:flex; align-items:center; gap:10px; padding:7px 10px; margin-bottom:7px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); }
.reply-draft-copy { min-width:0; flex:1; }
.reply-draft-title { color:var(--cyan); font-size:10px; font-weight:800; }
.reply-draft-text { color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.composer { min-height:52px; display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:end; gap:4px; border:1px solid var(--line); border-radius:17px; padding:3px 4px; background:rgba(255,255,255,.035); }
.composer textarea { min-height:44px; max-height:132px; resize:none; border:0; outline:0; color:var(--text); background:transparent; padding:12px 8px 9px; line-height:1.35; overflow:auto; }
.composer textarea::placeholder { color:var(--muted-2); }
.send-button { background:var(--cyan); color:#061014; border-radius:13px; margin-bottom:1px; }
.send-button:hover { background:#8defff; }
.recording-bar { min-height:52px; display:flex; align-items:center; gap:12px; border:1px solid rgba(255,79,97,.3); border-radius:17px; padding:4px 8px 4px 14px; background:var(--red-soft); }
.recording-pulse { width:9px; height:9px; border-radius:50%; background:var(--red); box-shadow:0 0 12px var(--red); animation:pulse 1.2s infinite; }
.recording-time { font:800 13px ui-monospace,monospace; }
.recording-label { color:var(--muted); font-size:11px; flex:1; }

.details-panel { border-left:1px solid var(--line); background:rgba(10,14,20,.91); min-width:0; overflow:auto; z-index:4; }
.details-head { padding:20px 18px; text-align:center; border-bottom:1px solid var(--line); }
.details-avatar { margin:6px auto 13px; }
.details-title { font-size:17px; font-weight:850; }
.details-subtitle { margin-top:5px; color:var(--green); font-size:11px; }
.details-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:17px; }
.detail-action { min-height:57px; border:1px solid var(--line); background:rgba(255,255,255,.025); border-radius:13px; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; font-size:9px; }
.detail-action .icon { width:18px; }
.detail-section { padding:15px 16px; border-bottom:1px solid var(--line); }
.section-label { color:var(--muted-2); font:700 9px ui-monospace,monospace; letter-spacing:.13em; text-transform:uppercase; margin-bottom:8px; }
.detail-row { min-height:42px; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; }
.detail-row .icon { width:17px; color:var(--cyan); }
.detail-row-value { margin-left:auto; color:var(--text); }
.media-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
.media-tile { aspect-ratio:1; border:1px solid var(--line); border-radius:8px; background:linear-gradient(145deg,#13232c,#0d121a); position:relative; overflow:hidden; }
.media-tile::after { content:""; position:absolute; inset:18%; border:1px solid rgba(81,223,247,.17); transform:rotate(12deg); }

.empty-state { height:100%; display:grid; place-items:center; padding:28px; text-align:center; }
.empty-core { max-width:420px; }
.empty-glyph { width:96px; height:96px; margin:0 auto 20px; border:1px solid var(--line-strong); display:grid; place-items:center; clip-path:polygon(12% 0,100% 0,100% 82%,82% 100%,0 100%,0 18%); color:var(--cyan); background:var(--cyan-soft); }
.empty-glyph .icon { width:40px; height:40px; }
.empty-title { font-size:21px; font-weight:850; }
.empty-text { margin-top:8px; color:var(--muted); line-height:1.5; font-size:13px; }

.mobile-bottom-nav { display:none; }
.fab { position:absolute; right:18px; bottom:calc(18px + var(--safe-bottom)); width:52px; height:52px; border:0; border-radius:16px; background:var(--cyan); color:#061014; box-shadow:0 14px 36px rgba(81,223,247,.2); cursor:pointer; z-index:7; }

.overlay-root { position:fixed; inset:0; z-index:30; pointer-events:none; }
.overlay-root.open { pointer-events:auto; }
.scrim { position:absolute; inset:0; background:rgba(1,3,6,.7); backdrop-filter:blur(7px); opacity:0; transition:opacity 200ms var(--ease); }
.open .scrim { opacity:1; }
.sheet {
  position:absolute; right:max(12px,var(--safe-right)); top:calc(12px + var(--safe-top)); bottom:calc(12px + var(--safe-bottom)); width:min(440px, calc(100% - 24px));
  border:1px solid var(--line); border-radius:22px; background:rgba(12,17,24,.98); box-shadow:var(--shadow); transform:translateX(calc(100% + 30px)); transition:transform 230ms var(--ease); overflow:hidden; display:flex; flex-direction:column;
}
.open .sheet { transform:translateX(0); }
.sheet-header { min-height:66px; display:flex; align-items:center; gap:10px; padding:10px 12px 10px 18px; border-bottom:1px solid var(--line); }
.sheet-title { font-size:17px; font-weight:850; }
.sheet-subtitle { color:var(--muted); font-size:10px; margin-top:3px; }
.sheet-close { margin-left:auto; }
.sheet-content { flex:1; overflow:auto; padding:17px; }
.menu-list { display:flex; flex-direction:column; gap:7px; }
.menu-row { min-height:55px; width:100%; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.025); color:var(--text); display:flex; align-items:center; gap:12px; padding:8px 12px; text-align:left; cursor:pointer; }
.menu-row .icon { color:var(--cyan); }
.menu-row-copy { min-width:0; flex:1; }
.menu-row-title { font-size:13px; font-weight:750; }
.menu-row-subtitle { margin-top:4px; color:var(--muted); font-size:10px; }
.toggle { width:42px; height:24px; border-radius:12px; background:#202a34; padding:3px; transition:background 160ms; }
.toggle::after { content:""; display:block; width:18px; height:18px; border-radius:50%; background:#7b8790; transition:transform 160ms, background 160ms; }
.toggle.on { background:rgba(81,223,247,.25); }
.toggle.on::after { transform:translateX(18px); background:var(--cyan); }
.call-screen { text-align:center; padding-top:12vh; }

// ---- ../src/core/selection.mjs ----
const LONG_PRESS_MS = 520;
const POINTER_MOVE_TOLERANCE_PX = 9;

function normalizeId(value) {
  if (value === null || value === undefined) return null;
  return String(value);
}

function createSelectionState() {
  return {
    phase: 'idle',
    chatId: null,
    ids: new Set(),
    pointerSession: null,
    suppressedClick: null,
    revision: 0
  };
}

function bump(state, patch = {}) {
  return { ...state, ...patch, revision: state.revision + 1 };
}

function clearState(state) {
  if (state.phase === 'idle' && state.ids.size === 0 && !state.pointerSession && !state.suppressedClick) {
    return state;
  }
  return bump(state, {
    phase: 'idle',
    chatId: null,
    ids: new Set(),
    pointerSession: null,
    suppressedClick: null
  });
}

function selectionReducer(state, event) {
  switch (event.type) {
    case 'POINTER_START': {
      const chatId = normalizeId(event.chatId);
      const messageId = normalizeId(event.messageId);
      if (!chatId || !messageId || event.selectable === false) return state;
      return bump(state, {
        pointerSession: {
          pointerId: event.pointerId,
          chatId,
          messageId,
          startedAt: event.startedAt ?? Date.now(),
          startX: Number(event.x ?? 0),
          startY: Number(event.y ?? 0),
          moved: false,
          longPressTriggered: false
        }
      });
    }

    case 'POINTER_MOVE': {
      const session = state.pointerSession;
      if (!session || session.pointerId !== event.pointerId) return state;
      const dx = Number(event.x ?? 0) - session.startX;
      const dy = Number(event.y ?? 0) - session.startY;
      if (Math.hypot(dx, dy) <= (event.tolerance ?? POINTER_MOVE_TOLERANCE_PX)) return state;
      return bump(state, { pointerSession: { ...session, moved: true } });
    }

    case 'LONG_PRESS': {
      const session = state.pointerSession;
      if (!session || session.pointerId !== event.pointerId || session.moved || session.longPressTriggered) return state;
      const ids = state.chatId === session.chatId ? new Set(state.ids) : new Set();
      ids.add(session.messageId);
      return bump(state, {
        phase: 'selecting',
        chatId: session.chatId,
        ids,
        pointerSession: { ...session, longPressTriggered: true },
        suppressedClick: {
          pointerId: session.pointerId,
          chatId: session.chatId,
          messageId: session.messageId,
          expiresAt: (event.at ?? Date.now()) + 900
        }
      });
    }

    case 'POINTER_END': {
      const session = state.pointerSession;
      if (!session || session.pointerId !== event.pointerId) return state;
      return bump(state, { pointerSession: null });
    }

    case 'POINTER_CANCEL': {
      if (!state.pointerSession) return state;
      if (event.pointerId !== undefined && state.pointerSession.pointerId !== event.pointerId) return state;
      return bump(state, { pointerSession: null });
    }

    case 'TOGGLE': {
      const chatId = normalizeId(event.chatId);
      const messageId = normalizeId(event.messageId);
      if (!chatId || !messageId || event.selectable === false) return state;
      if (state.phase === 'selecting' && state.chatId !== chatId) return state;
      const ids = new Set(state.ids);
      if (ids.has(messageId)) ids.delete(messageId);
      else ids.add(messageId);
      if (ids.size === 0) return clearState(state);
      return bump(state, { phase: 'selecting', chatId, ids });
    }

    case 'SELECT_ONLY': {
      const chatId = normalizeId(event.chatId);
      const messageId = normalizeId(event.messageId);
      if (!chatId || !messageId || event.selectable === false) return state;
      return bump(state, { phase: 'selecting', chatId, ids: new Set([messageId]) });
    }

    case 'RECONCILE': {
      if (state.phase !== 'selecting') return state;
      const chatId = normalizeId(event.chatId);
      if (chatId !== state.chatId) return state;
      const valid = new Set((event.messageIds ?? []).map(normalizeId).filter(Boolean));
      const ids = new Set([...state.ids].filter((id) => valid.has(id)));
      if (ids.size === 0) return clearState(state);
      if (ids.size === state.ids.size && [...ids].every((id) => state.ids.has(id))) return state;
      return bump(state, { ids });
    }

    case 'CONSUME_SUPPRESSED_CLICK': {
      const click = state.suppressedClick;
      if (!click) return { state, suppressed: false };
      const matches = click.pointerId === event.pointerId &&
        click.chatId === normalizeId(event.chatId) &&
        click.messageId === normalizeId(event.messageId) &&
        click.expiresAt >= (event.at ?? Date.now());
      return {
        state: matches ? bump(state, { suppressedClick: null }) : state,
        suppressed: matches
      };
    }

    case 'CLEAR':
    case 'CHAT_CHANGED':
    case 'CHAT_LIST_OPENED':
    case 'BACKGROUND':
    case 'LOGOUT':
      return clearState(state);

    default:
      return state;
  }
}

function consumeSuppressedClick(state, event) {
  const result = selectionReducer(state, { ...event, type: 'CONSUME_SUPPRESSED_CLICK' });
  return result.state ? result : { state, suppressed: false };
}

function selectedMessagesSnapshot(selection, messages) {
  if (selection.phase !== 'selecting') return Object.freeze([]);
  const selected = messages
    .filter((message) => selection.ids.has(normalizeId(message.id)))
    .map((message) => Object.freeze({ ...message }));
  return Object.freeze(selected);
}


// ---- ../src/core/capabilities.mjs ----
const ADMIN_ROLES = new Set(['owner', 'admin']);

function getMessageCapabilities({
  message,
  chat,
  currentUserId,
  currentUserRole = 'member',
  encryptionState = 'ready',
  networkState = 'online'
}) {
  const isSystem = message?.type === 'system';
  const isAuthor = String(message?.authorId) === String(currentUserId);
  const isAdmin = ADMIN_ROLES.has(currentUserRole);
  const chatType = chat?.type ?? 'direct';
  const encryptedUnavailable = Boolean(message?.encrypted) && (encryptionState !== 'ready' || message?.decrypted === false);
  const restricted = Boolean(message?.noForward || message?.selfDestructed || message?.deleted);
  const online = networkState !== 'offline';
  const canModerate = isAdmin && (chatType === 'group' || chatType === 'channel');
  const channelWriter = chatType !== 'channel' || isAdmin || chat?.permissions?.canPost === true;

  return {
    selectable: !message?.deleted,
    copyable: !isSystem && !message?.deleted && !encryptedUnavailable && ['text', 'photo', 'video', 'file', 'voice', 'sticker', 'ice'].includes(message?.type),
    forwardable: !isSystem && !restricted && !encryptedUnavailable,
    deletable: !isSystem && online && (isAuthor || canModerate),
    editable: !isSystem && online && isAuthor && channelWriter && message?.type === 'text' && !message?.forwardedFrom && !message?.selfDestructAt,
    pinnable: !isSystem && online && (chatType === 'direct' ? isAuthor : isAdmin),
    reactable: !isSystem && !message?.deleted && !encryptedUnavailable,
    downloadable: ['photo', 'video', 'file', 'voice'].includes(message?.type) && !message?.deleted && !encryptedUnavailable
  };
}

function aggregateCapabilities(messages, contextFactory) {
  const rows = messages.map((message) => getMessageCapabilities({ message, ...contextFactory(message) }));
  return {
    count: rows.length,
    copyable: rows.length > 0 && rows.every((row) => row.copyable),
    forwardable: rows.length > 0 && rows.every((row) => row.forwardable),
    deletable: rows.length > 0 && rows.some((row) => row.deletable),
    pinnable: rows.length === 1 && rows[0].pinnable
  };
}


// ---- ../src/core/operations.mjs ----

class OperationRegistry {
  #active = new Map();

  begin(kind, snapshot = {}) {
    const id = `${kind}:${crypto.randomUUID?.() ?? `${Date.now()}-${Math.random()}`}`;
    const operation = Object.freeze({
      id,
      kind,
      token: Symbol(id),
      startedAt: Date.now(),
      snapshot: Object.freeze({ ...snapshot })
    });
    this.#active.set(id, operation);
    return operation;
  }

  isActive(operation) {
    return this.#active.get(operation?.id)?.token === operation?.token;
  }

  finish(operation) {
    if (this.isActive(operation)) this.#active.delete(operation.id);
  }

  cancelAll() {
    this.#active.clear();
  }

  get size() {
    return this.#active.size;
  }
}

function withTimeout(promise, timeoutMs, label = 'operation') {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(`${label} timed out after ${timeoutMs}ms`)), timeoutMs);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}

async function mapWithConcurrency(items, limit, worker) {
  const safeLimit = Math.max(1, Math.min(Number(limit) || 1, items.length || 1));
  const results = new Array(items.length);
  let cursor = 0;
  async function run() {
    while (cursor < items.length) {
      const index = cursor++;
      try {
        results[index] = { status: 'fulfilled', value: await worker(items[index], index) };
      } catch (reason) {
        results[index] = { status: 'rejected', reason };
      }
    }
  }
  await Promise.all(Array.from({ length: safeLimit }, run));
  return results;
}

function messageToClipboardLine(message) {
  const labels = {
    photo: '[Фото]',
    video: '[Видео]',
    file: `[Файл${message.fileName ? `: ${message.fileName}` : ''}]`,
    voice: '[Голосовое]',
    sticker: '[Стикер]',
    system: '[Системное сообщение]',
    ice: message.text ? message.text : '[ICE-сообщение]'
  };
  return message.type === 'text' ? String(message.text ?? '') : (labels[message.type] ?? `[${message.type ?? 'Сообщение'}]`);
}

async function copyMessages(messages, clipboard) {
  const text = messages.map(messageToClipboardLine).join('\n');
  await clipboard.writeText(text);
  return { copied: messages.length, text };
}

const ALLOWED_FORWARD_FIELDS = [
  'type', 'text', 'mediaUrl', 'thumbnailUrl', 'fileName', 'fileSize', 'mimeType',
  'durationMs', 'width', 'height', 'stickerId', 'caption', 'encryptionEnvelope'
];

function createForwardDTO(message, { targetChatId, senderId, idempotencyKey }) {
  if (!message || message.deleted) throw new Error('Source message no longer exists');
  const dto = {
    id: crypto.randomUUID?.() ?? `${Date.now()}-${Math.random()}`,
    chatId: normalizeId(targetChatId),
    authorId: normalizeId(senderId),
    createdAt: null,
    status: 'sending',
    forwardedFrom: {
      chatId: normalizeId(message.chatId),
      messageId: normalizeId(message.id),
      authorId: normalizeId(message.authorId)
    },
    idempotencyKey
  };
  for (const field of ALLOWED_FORWARD_FIELDS) {
    if (message[field] !== undefined) dto[field] = structuredClone(message[field]);
  }
  return dto;
}

async function deleteMessages({ messages, canDelete, repository, operation, registry, timeoutMs = 9000, concurrency = 4 }) {
  const immutable = Object.freeze(messages.map((message) => Object.freeze({ ...message })));
  const allowed = immutable.filter(canDelete);
  const denied = immutable.filter((message) => !canDelete(message)).map((message) => ({ id: normalizeId(message.id), reason: 'permission-denied' }));
  const settled = await mapWithConcurrency(allowed, concurrency, async (message) => {
    if (!registry.isActive(operation)) throw new Error('operation-cancelled');
    const key = `${operation.id}:${normalizeId(message.id)}`;
    await withTimeout(repository.deleteMessage(message.chatId, message.id, key), timeoutMs, 'delete-message');
    if (!registry.isActive(operation)) throw new Error('stale-operation');
    return normalizeId(message.id);
  });
  const deleted = [];
  const failed = [...denied];
  settled.forEach((result, index) => {
    if (result.status === 'fulfilled') deleted.push(result.value);
    else failed.push({ id: normalizeId(allowed[index].id), reason: result.reason?.message ?? 'unknown' });
  });
  return { deleted, failed };
}

async function forwardMessages({ messages, targetChatId, senderId, repository, operation, registry, timeoutMs = 12000, concurrency = 3 }) {
  const immutable = Object.freeze(messages.map((message) => Object.freeze({ ...message })));
  const settled = await mapWithConcurrency(immutable, concurrency, async (message) => {
    if (!registry.isActive(operation)) throw new Error('operation-cancelled');
    const idempotencyKey = `${operation.id}:${normalizeId(message.id)}:${normalizeId(targetChatId)}`;
    const dto = createForwardDTO(message, { targetChatId, senderId, idempotencyKey });
    await withTimeout(repository.forwardMessage(dto), timeoutMs, 'forward-message');
    if (!registry.isActive(operation)) throw new Error('stale-operation');
    return normalizeId(message.id);
  });
  const forwarded = [];
  const failed = [];
  settled.forEach((result, index) => {
    if (result.status === 'fulfilled') forwarded.push(result.value);
    else failed.push({ id: normalizeId(immutable[index].id), reason: result.reason?.message ?? 'unknown' });
  });
  return { forwarded, failed };
}

async function pinMessage({ messages, repository, operation, registry, timeoutMs = 9000 }) {
  if (messages.length !== 1) throw new Error('Exactly one message must be selected');
  const message = Object.freeze({ ...messages[0] });
  await withTimeout(repository.pinMessage(message.chatId, message.id, operation.id), timeoutMs, 'pin-message');
  if (!registry.isActive(operation)) throw new Error('stale-operation');
  return normalizeId(message.id);
}

// ---- ../src/services/local-repository.mjs ----

const clone = (value) => structuredClone(value);
const wait = (ms = 70) => new Promise((resolve) => setTimeout(resolve, ms));
const createRepositoryId = () => globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(16).slice(2)}`;

class LocalRepository {
  #chats = clone(demoChats);
  #messages = clone(demoMessages);
  #listeners = new Map();
  #idempotency = new Set();

  async listChats() {
    await wait();
    return clone(this.#chats);
  }

  subscribeMessages(chatId, callback) {
    const key = String(chatId);
    const listener = { callback, active: true };
    if (!this.#listeners.has(key)) this.#listeners.set(key, new Set());
    this.#listeners.get(key).add(listener);
    queueMicrotask(() => listener.active && callback(clone(this.#messages[key] ?? []), { fromCache: false }));
    return () => {
      listener.active = false;
      this.#listeners.get(key)?.delete(listener);
      if (this.#listeners.get(key)?.size === 0) this.#listeners.delete(key);
    };
  }

  #emit(chatId) {
    const key = String(chatId);
    for (const listener of this.#listeners.get(key) ?? []) {
      if (listener.active) listener.callback(clone(this.#messages[key] ?? []), { fromCache: false });
    }
  }

  async sendMessage(chatId, draft, idempotencyKey) {
    await wait(110);
    if (this.#idempotency.has(idempotencyKey)) return;
    this.#idempotency.add(idempotencyKey);
    const key = String(chatId);
    this.#messages[key] ??= [];
    this.#messages[key].push({
      ...clone(draft),
      id: draft.id ?? createRepositoryId(),
      chatId: key,
      createdAt: Date.now(),
      time: new Intl.DateTimeFormat('ru-RU', { hour: '2-digit', minute: '2-digit' }).format(new Date()),
      status: 'sent'
    });
    this.#emit(key);
  }

  async deleteMessage(chatId, messageId, idempotencyKey) {
    await wait(95);
    if (this.#idempotency.has(idempotencyKey)) return;
    this.#idempotency.add(idempotencyKey);
    const key = String(chatId);
    const before = this.#messages[key] ?? [];
    if (!before.some((item) => String(item.id) === String(messageId))) throw new Error('message-not-found');
    this.#messages[key] = before.filter((item) => String(item.id) !== String(messageId));
    this.#emit(key);
  }

  async forwardMessage(dto) {
    await wait(110);
    if (this.#idempotency.has(dto.idempotencyKey)) return;
    this.#idempotency.add(dto.idempotencyKey);
    const key = String(dto.chatId);
    this.#messages[key] ??= [];
    this.#messages[key].push({ ...clone(dto), createdAt: Date.now(), time: 'сейчас', status: 'sent' });
    this.#emit(key);
  }

  async pinMessage(chatId, messageId, idempotencyKey) {
    await wait(90);
    if (this.#idempotency.has(idempotencyKey)) return;
    this.#idempotency.add(idempotencyKey);
    const key = String(chatId);
    if (!(this.#messages[key] ?? []).some((item) => String(item.id) === String(messageId))) throw new Error('message-not-found');
    this.#chats = this.#chats.map((chat) => String(chat.id) === key ? { ...chat, pinnedMessageId: String(messageId) } : chat);
  }
}

function icon(name, className = '') {
  return `<svg class="icon ${className}" viewBox="0 0 24 24" aria-hidden="true">${icons[name] ?? icons.info}</svg>`;
}

function escapeHtml(value = '') {
  return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
}

function formatBytes(value = 0) {
  if (value < 1024) return `${value} Б`;
  if (value < 1024 ** 2) return `${(value / 1024).toFixed(1)} КБ`;
  return `${(value / 1024 ** 2).toFixed(1)} МБ`;
}

function formatDuration(ms = 0) {
  const total = Math.floor(ms / 1000);
  return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
}

function activeChat() {
  return state.chats.find((chat) => String(chat.id) === String(state.activeChatId)) ?? null;
}

function activeMessages() {
  return state.messages.get(String(state.activeChatId)) ?? [];
}

function capabilitiesFor(message) {
  const chat = activeChat();
  return getMessageCapabilities({
    message,
    chat,
    currentUserId: currentUser.id,
    currentUserRole: chat?.role ?? 'member',
    encryptionState: 'ready',
    networkState: state.networkState
  });
}

function setSelection(nextSelection, shouldRender = true) {
  const entering = state.selection.phase !== 'selecting' && nextSelection.phase === 'selecting';
  state.selection = nextSelection;
  if (entering) {
    state.replyDraft = state.replyDraft;
    cancelVoice('selection');
  }
  if (shouldRender) render();
}

function clearSelection(reason = 'CLEAR') {
  operations.cancelAll();
  state.actionBusy = null;
  setSelection(selectionReducer(state.selection, { type: reason }));
}

function toast(title, detail = '', type = 'info') {
  const id = ++toastSequence;
  state.toasts.push({ id, title, detail, type });
  renderToasts();
  setTimeout(() => {
    state.toasts = state.toasts.filter((item) => item.id !== id);
    renderToasts();
  }, 3400);
}

function renderToasts() {
  let stack = document.querySelector('.toast-stack');
  if (!stack) {
    stack = document.createElement('div');
    stack.className = 'toast-stack';
    document.body.append(stack);
  }
  stack.innerHTML = state.toasts.map((item) => `<div class="toast ${item.type === 'error' ? 'error' : ''}"><div class="toast-title">${escapeHtml(item.title)}</div>${item.detail ? `<div class="toast-detail">${escapeHtml(item.detail)}</div>` : ''}</div>`).join('');
}

async function initialize() {
  state.chats = await repository.listChats();
  if (state.authenticated && !state.activeChatId && innerWidth > 850) selectChat(state.chats[0]?.id, false);
  render();
}

function selectChat(chatId, shouldRender = true) {
  const nextId = String(chatId);
  if (nextId === String(state.activeChatId)) return;
  operations.cancelAll();
  state.actionBusy = null;
  state.selection = selectionReducer(state.selection, { type: 'CHAT_CHANGED' });
  cancelVoice('navigation');
  unsubscribeMessages?.();
  unsubscribeMessages = null;
  state.activeChatId = nextId;
  state.replyDraft = null;
  const token = ++subscriptionToken;
  unsubscribeMessages = repository.subscribeMessages(nextId, (messages) => {
    if (token !== subscriptionToken || String(state.activeChatId) !== nextId) return;
    const normalized = messages.map((message) => ({ ...message, id: String(message.id), chatId: String(message.chatId) }));
    state.messages.set(nextId, normalized);
    state.selection = selectionReducer(state.selection, { type: 'RECONCILE', chatId: nextId, messageIds: normalized.map((message) => message.id) });
    render();
    requestAnimationFrame(() => scrollMessagesToBottom(false));
  });
  if (shouldRender) render();
}

function openChatList() {
  operations.cancelAll();
  state.selection = selectionReducer(state.selection, { type: 'CHAT_LIST_OPENED' });
  cancelVoice('navigation');
  state.activeChatId = null;
  unsubscribeMessages?.();
  unsubscribeMessages = null;
  subscriptionToken++;
  render();
}

function filteredChats() {
  const query = state.chatSearch.trim().toLocaleLowerCase('ru');
  return state.chats.filter((chat) => {
    const matchType = state.chatFilter === 'all' || chat.type === state.chatFilter || (state.chatFilter === 'unread' && chat.unread > 0);
    const matchQuery = !query || `${chat.title} ${chat.lastMessage}`.toLocaleLowerCase('ru').includes(query);
    return matchType && matchQuery;
  });
}

    <div class="chat-scroll">${chats.length ? chats.map(renderChatItem).join('') : `<div class="empty-state"><div class="empty-core"><div class="empty-title">Сигналов нет</div><div class="empty-text">Измените фильтр или поисковый запрос.</div></div></div>`}</div>
    <button class="fab" data-open-overlay="contacts" aria-label="Новый чат">${icon('plus')}</button>
  </section>`;
}

function renderChatItem(chat) {
  const type = chat.type === 'direct' ? 'DM' : chat.type === 'group' ? 'GRP' : 'CH';
  return `<button class="chat-item ${String(chat.id) === String(state.activeChatId) ? 'active' : ''}" data-chat-id="${escapeHtml(chat.id)}" aria-label="Открыть ${escapeHtml(chat.title)}">
    <span class="avatar ${chat.accent}">${escapeHtml(chat.avatar)}</span>
    <span class="chat-main"><span class="chat-line"><span class="chat-name">${escapeHtml(chat.title)}</span><span class="type-chip">${type}</span></span><span class="chat-preview">${escapeHtml(chat.lastMessage)}</span></span>
    <span class="chat-meta"><span>${escapeHtml(chat.lastAt)}</span>${chat.unread ? `<span class="unread">${chat.unread > 99 ? '99+' : chat.unread}</span>` : (chat.muted ? icon('muted') : '')}</span>
  </button>`;
}

function renderConversation() {
  const chat = activeChat();
  if (!chat) return `<section class="conversation-panel">${renderEmptyConversation()}</section>`;
  const messages = activeMessages();
  const selected = selectedMessagesSnapshot(state.selection, messages);
  const agg = aggregateCapabilities(selected, () => ({ chat, currentUserId: currentUser.id, currentUserRole: chat.role, encryptionState: 'ready', networkState: state.networkState }));
  return `<section class="conversation-panel" aria-label="Чат ${escapeHtml(chat.title)}">
    ${state.selection.phase === 'selecting' ? renderSelectionHeader(agg) : renderChatHeader(chat)}
    ${chat.pinnedMessageId ? renderPinnedBar(chat, messages) : ''}
    <div class="messages-scroll" data-role="messages-scroll" role="log" aria-label="Сообщения" tabindex="0">
      <div class="day-divider">Сегодня</div>
      ${messages.map((message) => renderMessage(message, chat)).join('')}
    </div>
    ${state.selection.phase === 'selecting' ? '' : renderComposer(chat)}
  </section>`;
}

function renderEmptyConversation() {
  return `<div class="empty-state"><div class="empty-core"><div class="empty-glyph">${icon('chats')}</div><div class="empty-title">Выберите линию связи</div><div class="empty-text">Откройте личный чат, группу или канал. Черновики сохраняются локально даже при нестабильной сети.</div></div></div>`;
}

function renderChatHeader(chat) {
  return `<header class="chat-header">
    <button class="icon-button mobile-back" data-action="back-to-list" aria-label="Назад">${icon('back')}</button>
    <button class="header-identity" data-open-overlay="chat-settings">
      <span class="avatar ${chat.accent}">${escapeHtml(chat.avatar)}</span>
      <span class="header-copy"><span class="header-title">${escapeHtml(chat.title)}</span><span class="header-subtitle">${escapeHtml(chat.subtitle)}</span></span>
    </button>
    <div class="header-actions">
      <button class="icon-button hide-narrow" data-open-overlay="message-search" aria-label="Поиск по сообщениям">${icon('search')}</button>
      <button class="icon-button" data-open-overlay="audio-call" aria-label="Аудиозвонок">${icon('phone')}</button>
      <button class="icon-button hide-narrow" data-open-overlay="video-call" aria-label="Видеозвонок">${icon('video')}</button>
      <button class="icon-button" data-open-overlay="chat-settings" aria-label="Настройки чата">${icon('more')}</button>
    </div>
  </header>`;
}

function renderSelectionHeader(agg) {
  const busy = Boolean(state.actionBusy);
  return `<header class="selection-header" aria-label="Панель выделения">
    <button class="icon-button" data-action="selection-clear" aria-label="Отменить выделение">${icon('close')}</button>
    <div class="selection-count" aria-live="polite"><strong>${state.selection.ids.size}</strong><span>выбрано</span></div>
    <div class="selection-actions">
      <button class="icon-button" data-action="selection-copy" aria-label="Копировать" title="Копировать" ${busy || !agg.copyable ? 'disabled' : ''}>${icon('copy')}</button>
      <button class="icon-button" data-action="selection-forward" aria-label="Переслать" title="Переслать" ${busy || !agg.forwardable ? 'disabled' : ''}>${icon('forward')}</button>
      <button class="icon-button" data-action="selection-pin" aria-label="Закрепить" title="Закрепить" ${busy || !agg.pinnable ? 'disabled' : ''}>${icon('pin')}</button>
      <button class="icon-button" data-action="selection-delete" aria-label="Удалить" title="Удалить" ${busy || !agg.deletable ? 'disabled' : ''}>${icon('trash')}</button>
    </div>
  </header>`;
}

function renderPinnedBar(chat, messages) {
  const message = messages.find((item) => String(item.id) === String(chat.pinnedMessageId));
  return `<button class="pinned-bar" data-message-id="${escapeHtml(chat.pinnedMessageId)}"><span class="pinned-accent"></span><span class="pinned-copy"><span class="pinned-label">Закреплённое сообщение</span><span class="pinned-text">${escapeHtml(message?.text ?? message?.caption ?? '[Медиа]')}</span></span></button>`;
}

function renderMessage(message, chat) {
  if (message.type === 'system') return `<div class="system-message" data-message-id="${escapeHtml(message.id)}">${escapeHtml(message.text)}</div>`;
  const own = String(message.authorId) === String(currentUser.id);
  const selected = state.selection.chatId === String(chat.id) && state.selection.ids.has(String(message.id));
  const caps = capabilitiesFor(message);
  const body = renderMessageBody(message);
  return `<article class="message-row ${own ? 'own' : ''} ${selected ? 'selected' : ''}" data-message-id="${escapeHtml(message.id)}" data-chat-id="${escapeHtml(chat.id)}" aria-selected="${selected}" tabindex="0">
    <div class="message-hit" data-message-hit="${escapeHtml(message.id)}" data-selectable="${caps.selectable}">
      ${!own && chat.type !== 'direct' ? `<span class="avatar message-avatar">${escapeHtml((message.authorName || '?').slice(0,2).toUpperCase())}</span>` : ''}
      <div class="message-bubble ${message.type === 'photo' ? 'media-card' : ''}">
        ${!own && chat.type !== 'direct' ? `<div class="message-author">${escapeHtml(message.authorName)}</div>` : ''}
        ${message.replyTo ? `<div class="reply-quote" data-jump-message="${escapeHtml(message.replyTo.messageId)}">${escapeHtml(message.replyTo.text)}</div>` : ''}
        ${body}
        ${message.reactions ? `<div class="reactions">${Object.entries(message.reactions).map(([emoji,count]) => `<button class="reaction" data-reaction="${escapeHtml(message.id)}">${escapeHtml(emoji)} ${count}</button>`).join('')}</div>` : ''}
        <div class="message-meta"><span>${escapeHtml(message.time ?? '')}</span>${own ? `<span class="delivery">${message.status === 'sent' ? '✓' : '✓✓'}</span>` : ''}</div>
      </div>
    </div>
  </article>`;
}

function renderMessageBody(message) {
  switch (message.type) {
    case 'text': return `<div class="message-text">${escapeHtml(message.text)}</div>`;
    case 'photo': return `<div class="media-preview" role="img" aria-label="Изображение: ${escapeHtml(message.caption ?? '')}"></div>${message.caption ? `<div class="media-caption">${escapeHtml(message.caption)}</div>` : ''}`;
    case 'file': return `<div class="file-card"><div class="file-icon">${icon('file')}</div><div><div class="file-name">${escapeHtml(message.fileName)}</div><div class="file-size">${formatBytes(message.fileSize)}</div></div></div>`;
    case 'voice': {
      const bars = Array.from({ length: 26 }, (_, index) => `<span style="height:${8 + ((index * 13) % 21)}px"></span>`).join('');
      return `<div class="voice-card"><button class="voice-play" data-action="play-voice" aria-label="Воспроизвести">${icon('play')}</button><div class="waveform">${bars}</div><span class="voice-duration">${formatDuration(message.durationMs)}</span></div>`;
    }
    default: return `<div class="message-text">[${escapeHtml(message.type)}]</div>`;
  }
}

function renderComposer(chat) {
  const draft = state.draftByChat[chat.id] ?? '';
  if (state.voice.phase !== 'idle') {
    return `<footer class="composer-wrap"><div class="recording-bar"><span class="recording-pulse"></span><span class="recording-time">${formatDuration(state.voice.elapsedMs)}</span><span class="recording-label">${state.voice.phase === 'requesting' ? 'Запрос доступа к микрофону…' : 'Запись голосового сообщения'}</span><button class="icon-button" data-action="voice-cancel" aria-label="Отменить">${icon('trash')}</button><button class="icon-button send-button" data-action="voice-stop" aria-label="Завершить и отправить" ${state.voice.phase !== 'recording' ? 'disabled' : ''}>${icon('stop')}</button></div></footer>`;
  }
  return `<footer class="composer-wrap">
    ${state.replyDraft ? `<div class="reply-draft"><span class="pinned-accent"></span><div class="reply-draft-copy"><div class="reply-draft-title">Ответ ${escapeHtml(state.replyDraft.authorName ?? '')}</div><div class="reply-draft-text">${escapeHtml(state.replyDraft.text ?? state.replyDraft.caption ?? '[Медиа]')}</div></div><button class="icon-button" data-action="reply-cancel" aria-label="Отменить ответ">${icon('close')}</button></div>` : ''}
    <form class="composer" data-action="send-message">
      <button type="button" class="icon-button" data-open-overlay="attachments" aria-label="Прикрепить файл">${icon('paperclip')}</button>
      <textarea data-role="composer-input" rows="1" aria-label="Сообщение" placeholder="Сообщение в ${escapeHtml(chat.title)}">${escapeHtml(draft)}</textarea>
      <button type="button" class="icon-button emoji-button" data-action="emoji" aria-label="Эмодзи">${icon('smile')}</button>
      ${draft.trim() ? `<button class="icon-button send-button" type="submit" aria-label="Отправить">${icon('send')}</button>` : `<button class="icon-button" type="button" data-action="voice-start" aria-label="Записать голосовое">${icon('mic')}</button>`}
    </form>
  </footer>`;
}

function renderDetails() {
  const chat = activeChat();
  if (!chat) return `<aside class="details-panel"></aside>`;
  return `<aside class="details-panel" aria-label="Информация о чате">
    <div class="details-head"><div class="avatar large details-avatar ${chat.accent}">${escapeHtml(chat.avatar)}</div><div class="details-title">${escapeHtml(chat.title)}</div><div class="details-subtitle">${escapeHtml(chat.subtitle)}</div>
      <div class="details-actions"><button class="detail-action" data-open-overlay="audio-call">${icon('phone')}Звонок</button><button class="detail-action" data-open-overlay="message-search">${icon('search')}Поиск</button><button class="detail-action" data-open-overlay="chat-settings">${icon('more')}Ещё</button></div>
    </div>
    <section class="detail-section"><div class="section-label">Контур</div><div class="detail-row">${icon('lock')}Шифрование<span class="detail-row-value">E2E READY</span></div><div class="detail-row">${icon('wifi')}Состояние<span class="detail-row-value">${state.networkState === 'online' ? 'SYNC' : 'OFFLINE'}</span></div><div class="detail-row">${icon('bell')}Уведомления<span class="detail-row-value">${chat.muted ? 'Выкл.' : 'Вкл.'}</span></div></section>
    <section class="detail-section"><div class="section-label">Медиа</div><div class="media-grid">${Array.from({ length: 6 }, () => '<button class="media-tile" data-open-overlay="media"></button>').join('')}</div></section>

function renderBottomNav() {
  return `<nav class="mobile-bottom-nav" aria-label="Навигация"><button class="bottom-button active" data-action="back-to-list">${icon('chats')}Чаты</button><button class="bottom-button" data-open-overlay="contacts">${icon('contacts')}Контакты</button><button class="bottom-button" data-open-overlay="bookmarks">${icon('bookmark')}Метки</button><button class="bottom-button" data-open-overlay="settings">${icon('settings')}Настройки</button></nav>`;
}

function renderOverlay() {
  if (!state.overlay) return '<div class="overlay-root"></div>';
  const titleMap = {
    contacts: ['Контакты', 'ПОИСК И НОВЫЕ ДИАЛОГИ'], bookmarks: ['Закладки', 'СОХРАНЁННЫЕ СООБЩЕНИЯ'], archive: ['Архив', 'СКРЫТЫЕ ЛИНИИ СВЯЗИ'],
    settings: ['Настройки', 'ПАРАМЕТРЫ КЛИЕНТА'], profile: ['Профиль', 'ИДЕНТИФИКАТОР ОПЕРАТОРА'], 'chat-settings': ['Настройки чата', 'ПРАВА, МЕДИА И УЧАСТНИКИ'],
    'message-search': ['Поиск', 'ПО СООБЩЕНИЯМ'], downloads: ['Загрузки', 'ФАЙЛЫ И МЕДИА'], invites: ['Приглашения', 'ЗАЯВКИ НА ВСТУПЛЕНИЕ'],
    attachments: ['Вложение', 'ВЫБОР ТИПА ДАННЫХ'], media: ['Медиа', 'ПРОСМОТР'], 'audio-call': ['Аудиозвонок', 'SECURE VOICE LINK'], 'video-call': ['Видеозвонок', 'SECURE VIDEO LINK'],

function renderOverlayContent() {
  switch (state.overlay) {
    case 'contacts': return renderContacts();

    case 'archive': return renderArchive();
    case 'settings': return renderSettings();
    case 'profile': return renderProfile();

    ${menuRow('chats','Компактный режим','Больше диалогов на экране','toggle-compact',`<span class="toggle ${state.settings.compact ? 'on' : ''}"></span>`)}
    ${menuRow('check','Отчёты о прочтении','Показывать статус доставки','toggle-receipts',`<span class="toggle ${state.settings.readReceipts ? 'on' : ''}"></span>`)}
    ${menuRow('download','Управление загрузками','Автозагрузка и локальные файлы','open-downloads')}
    ${menuRow('userPlus','Приглашения и заявки','Управление доступом','open-invites')}
    ${menuRow('shield','Приватность и безопасность','Устройства, E2E и сессии','security-info')}
    ${menuRow('logout','Выйти из сети','Локальная сессия будет закрыта','logout')}
  </div>`;
}

function renderProfile() {
  return `<div style="text-align:center;padding:12px 0 25px"><div class="avatar large" style="margin:auto">${currentUser.avatar}</div><h2>${currentUser.name}</h2><div class="header-subtitle">${currentUser.handle}</div></div><div class="menu-list">${menuRow('key','NCN ID','ncn://operator/vega.zero')}${menuRow('shield','E2E ключ','Отпечаток 7C:19:AA:0F')}${menuRow('database','Хранилище','128 МБ локального кэша')}</div>`;
}

function renderChatSettings() {
  const chat = activeChat();
  if (!chat) return '<div class="empty-text">Чат не выбран.</div>';

}

function renderMessageSearch() {
  const query = state.messageSearch.trim().toLocaleLowerCase('ru');

  return `<div class="search-wrap" style="margin:0 0 15px">${icon('search')}<input class="search-input" data-role="message-search-input" value="${escapeHtml(state.messageSearch)}" placeholder="Текст сообщения" /></div><div class="menu-list">${results.map((message) => menuRow(message.type === 'text' ? 'chats' : 'file', message.authorName ?? 'Система', message.text ?? message.caption ?? `[${message.type}]`, 'search-result-open')).join('') || '<div class="empty-text">Совпадений нет.</div>'}</div>`;
}

function renderDownloads() {
  return `<div class="menu-list">${menuRow('file','relay-map.ncn','277.5 КБ · загружено','download-open')}${menuRow('image','Северный шлюз','Изображение · кэш','download-open')}</div>`;
}

function renderInvites() {
  return `<div class="menu-list">${menuRow('userPlus','Pacifica Ops','Заявка на вступление · ожидает','invite-action')}${menuRow('key','Код приглашения','NCN-7F2A-19C0 · действует 24 часа','copy-invite')}</div>`;
}

function renderAttachments() {
  return `<div class="menu-list">${menuRow('image','Фото или видео','Камера и медиатека','attachment-demo')}${menuRow('file','Файл','Документы и архивы','attachment-demo')}${menuRow('mic','Голосовое сообщение','Запись с микрофона','voice-start-overlay')}${menuRow('lock','ICE-сообщение','Доступ по одноразовому коду','ice-demo')}</div>`;
}

function renderForwardPicker() {

function render() {
  if (!state.authenticated) {
    app.innerHTML = renderAuth();
    renderToasts();
    return;
  }
  app.innerHTML = `<main class="app-shell ${state.activeChatId ? 'chat-open' : ''}">${renderRail()}${renderChatList()}${renderConversation()}${renderDetails()}${renderBottomNav()}</main>${renderOverlay()}`;
  renderToasts();
}

function openOverlay(name, payload = null) {
  state.overlay = name === 'chats' ? null : name;
  state.overlayPayload = payload;
  render();
}

function closeOverlay() {
  state.overlay = null;
  state.overlayPayload = null;
  render();
}

function scrollMessagesToBottom(smooth = true) {
  const target = document.querySelector('[data-role="messages-scroll"]');
  if (target) target.scrollTo({ top: target.scrollHeight, behavior: smooth && !state.reducedMotion ? 'smooth' : 'auto' });
}

function selectedSnapshot() {
  return selectedMessagesSnapshot(state.selection, activeMessages());
}

async function writeClipboard(text) {
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
  const area = document.createElement('textarea');
  area.value = text;
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.append(area);
  area.select();
  const ok = document.execCommand('copy');
  area.remove();
  if (!ok) throw new Error('clipboard-denied');
}

async function handleCopySelection() {
  if (state.actionBusy) return;
  const snapshot = selectedSnapshot();
  state.actionBusy = 'copy'; render();
  try {
    await copyMessages(snapshot, { writeText: writeClipboard });
    clearSelection('CLEAR');
    toast('Скопировано', `${snapshot.length} сообщений`);
  } catch (error) {
    state.actionBusy = null; render();
    toast('Не удалось скопировать', 'Выделение сохранено.', 'error');
  }
}

async function handleDeleteSelection() {
  if (state.actionBusy) return;
  const snapshot = selectedSnapshot();
  const operation = operations.begin('delete', { chatId: state.activeChatId, ids: snapshot.map((item) => item.id), selectionRevision: state.selection.revision });
  state.actionBusy = 'delete'; render();
  try {
    const result = await deleteMessages({
      messages: snapshot,
      canDelete: (message) => capabilitiesFor(message).deletable,
      repository,
      operation,
      registry: operations
    });
    if (!operations.isActive(operation)) return;
    const failedIds = new Set(result.failed.map((item) => item.id));
    if (failedIds.size) {
      state.selection = { ...state.selection, ids: failedIds, phase: 'selecting', revision: state.selection.revision + 1 };
      toast('Удалено частично', `Удалено: ${result.deleted.length}, ошибок: ${result.failed.length}`, 'error');
    } else {
      state.selection = selectionReducer(state.selection, { type: 'CLEAR' });
      toast('Сообщения удалены', `${result.deleted.length} шт.`);
    }
  } catch (error) {
    toast('Ошибка удаления', error.message, 'error');
  } finally {
    operations.finish(operation);
    state.actionBusy = null;
    render();
  }
}

async function handleForwardTarget(targetChatId) {
  if (state.actionBusy) return;
  const snapshot = selectedSnapshot();
  const operation = operations.begin('forward', { sourceChatId: state.activeChatId, targetChatId, ids: snapshot.map((item) => item.id), selectionRevision: state.selection.revision });
  state.actionBusy = 'forward'; closeOverlay();
  try {
    const result = await forwardMessages({ messages: snapshot, targetChatId, senderId: currentUser.id, repository, operation, registry: operations });
    if (!operations.isActive(operation)) return;
    if (result.failed.length) {
      state.selection = { ...state.selection, ids: new Set(result.failed.map((item) => item.id)), phase: 'selecting', revision: state.selection.revision + 1 };
      toast('Переслано частично', `Успешно: ${result.forwarded.length}, ошибок: ${result.failed.length}`, 'error');
    } else {
      state.selection = selectionReducer(state.selection, { type: 'CLEAR' });
      toast('Переслано', `${result.forwarded.length} сообщений`);
    }
  } catch (error) {
    toast('Ошибка пересылки', error.message, 'error');
  } finally {
    operations.finish(operation);
    state.actionBusy = null;
    render();
  }
}

async function handlePinSelection() {
  if (state.actionBusy) return;
  const snapshot = selectedSnapshot();
  const operation = operations.begin('pin', { chatId: state.activeChatId, ids: snapshot.map((item) => item.id) });
  state.actionBusy = 'pin'; render();
  try {
    const id = await pinMessage({ messages: snapshot, repository, operation, registry: operations });
    if (!operations.isActive(operation)) return;
    state.chats = state.chats.map((chat) => String(chat.id) === String(state.activeChatId) ? { ...chat, pinnedMessageId: id } : chat);
    state.selection = selectionReducer(state.selection, { type: 'CLEAR' });
    toast('Сообщение закреплено');
  } catch (error) {
    toast('Не удалось закрепить', 'Выделение сохранено.', 'error');
  } finally {
    operations.finish(operation);
    state.actionBusy = null;
    render();
  }
}

async function sendTextMessage(text) {
  const chat = activeChat();
  if (!chat || !text.trim()) return;
  const id = createId();
  const draft = {
    id,
    authorId: currentUser.id,
    authorName: currentUser.name,
    type: 'text',
    text: text.trim(),
    replyTo: state.replyDraft ? { messageId: String(state.replyDraft.id), text: state.replyDraft.text ?? state.replyDraft.caption ?? '[Медиа]' } : null
  };
  state.draftByChat[chat.id] = '';
  state.replyDraft = null;
  saveDrafts();
  render();
  try {
    await repository.sendMessage(chat.id, draft, `send:${chat.id}:${id}`);
    requestAnimationFrame(() => scrollMessagesToBottom(true));
  } catch (error) {
    state.draftByChat[chat.id] = text;
    saveDrafts();
    render();
    toast('Сообщение не отправлено', 'Черновик восстановлен.', 'error');
  }
}

function saveDrafts() {
  localStorage.setItem('ncn.drafts', JSON.stringify(state.draftByChat));
}

async function startVoiceRecording() {
  if (state.selection.phase === 'selecting' || state.voice.phase !== 'idle') return;
  const token = ++voiceRequestToken;
  state.voice = { phase: 'requesting', startedAt: null, elapsedMs: 0 };
  render();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (token !== voiceRequestToken || state.selection.phase === 'selecting' || state.voice.phase !== 'requesting') {
      stream.getTracks().forEach((track) => track.stop());
      return;
    }
    activeMediaStream = stream;
    state.voice = { phase: 'recording', startedAt: Date.now(), elapsedMs: 0 };
    render();
    tickVoice(token);
  } catch (error) {
    if (token !== voiceRequestToken) return;
    state.voice = { phase: 'idle', startedAt: null, elapsedMs: 0 };
    render();
    toast('Микрофон недоступен', 'Разрешение не выдано или устройство не найдено.', 'error');
  }
}

function tickVoice(token) {
  if (token !== voiceRequestToken || state.voice.phase !== 'recording') return;
  state.voice.elapsedMs = Date.now() - state.voice.startedAt;
  const label = document.querySelector('.recording-time');
  if (label) label.textContent = formatDuration(state.voice.elapsedMs);
  requestAnimationFrame(() => tickVoice(token));
}

function cancelVoice(reason = 'cancel') {
  voiceRequestToken++;
  activeMediaStream?.getTracks().forEach((track) => track.stop());
  activeMediaStream = null;
  if (state.voice.phase !== 'idle') state.voice = { phase: 'idle', startedAt: null, elapsedMs: 0 };
}

async function stopVoiceAndSend() {
  if (state.voice.phase !== 'recording') return;
  const durationMs = state.voice.elapsedMs;
  const chat = activeChat();
  cancelVoice('send');
  render();
  if (!chat || durationMs < 500) {
    toast('Запись отменена', 'Голосовое слишком короткое.', 'error');
    return;
  }
  const id = createId();
  await repository.sendMessage(chat.id, { id, authorId: currentUser.id, authorName: currentUser.name, type: 'voice', durationMs }, `voice:${chat.id}:${id}`);
}

function pointerStart(event, hit) {
  if (event.button !== undefined && event.button !== 0) return;
  const row = hit.closest('.message-row');
  const messageId = row?.dataset.messageId;
  const chatId = row?.dataset.chatId;
  if (!messageId || !chatId || hit.dataset.selectable !== 'true') return;
  clearTimeout(pointerTimer);
  state.selection = selectionReducer(state.selection, { type: 'POINTER_START', pointerId: event.pointerId, chatId, messageId, x: event.clientX, y: event.clientY, startedAt: Date.now(), selectable: true });
  pointerTimer = setTimeout(() => {
    const next = selectionReducer(state.selection, { type: 'LONG_PRESS', pointerId: event.pointerId, at: Date.now() });
    if (next !== state.selection) {
      setSelection(next);
      navigator.vibrate?.(22);
    }
  }, LONG_PRESS_MS);
}

function pointerMove(event) {
  if (!state.selection.pointerSession) return;
  const next = selectionReducer(state.selection, { type: 'POINTER_MOVE', pointerId: event.pointerId, x: event.clientX, y: event.clientY });
  if (next.pointerSession?.moved) clearTimeout(pointerTimer);
  state.selection = next;
}

function pointerEnd(event, cancelled = false) {
  clearTimeout(pointerTimer);
  state.selection = selectionReducer(state.selection, { type: cancelled ? 'POINTER_CANCEL' : 'POINTER_END', pointerId: event.pointerId });
}

function handleMessageClick(event, row) {
  const messageId = row.dataset.messageId;
  const chatId = row.dataset.chatId;
  const consumed = consumeSuppressedClick(state.selection, { pointerId: event.pointerId, chatId, messageId, at: Date.now() });
  state.selection = consumed.state;
  if (consumed.suppressed) {
    render();
    return;
  }
  if (state.selection.phase === 'selecting') {
    const message = activeMessages().find((item) => String(item.id) === String(messageId));
    state.selection = selectionReducer(state.selection, { type: 'TOGGLE', chatId, messageId, selectable: capabilitiesFor(message).selectable });
    render();
  }
}

app.addEventListener('pointerdown', (event) => {
  const hit = event.target.closest('[data-message-hit]');
  if (hit) pointerStart(event, hit);
});
app.addEventListener('pointermove', pointerMove);
app.addEventListener('pointerup', (event) => pointerEnd(event));
app.addEventListener('pointercancel', (event) => pointerEnd(event, true));
app.addEventListener('contextmenu', (event) => {
  if (event.target.closest('[data-message-hit]')) event.preventDefault();
});

app.addEventListener('input', (event) => {
  if (event.target.matches('[data-role="chat-search"]')) {
    state.chatSearch = event.target.value;
    render();
    requestAnimationFrame(() => document.querySelector('[data-role="chat-search"]')?.focus());
  }
  if (event.target.matches('[data-role="composer-input"]')) {
    const chat = activeChat();
    if (!chat) return;
    state.draftByChat[chat.id] = event.target.value;
    saveDrafts();
    const textarea = event.target;
    textarea.style.height = 'auto';
    textarea.style.height = `${Math.min(textarea.scrollHeight, 132)}px`;
    const form = textarea.closest('form');
    const actionButton = form?.querySelector('[data-action="voice-start"], .send-button');
    if (actionButton && ((textarea.value.trim() && actionButton.dataset.action === 'voice-start') || (!textarea.value.trim() && !actionButton.dataset.action))) render();
  }
  if (event.target.matches('[data-role="message-search-input"]')) {
    state.messageSearch = event.target.value;
    render();
    requestAnimationFrame(() => document.querySelector('[data-role="message-search-input"]')?.focus());
  }
});

app.addEventListener('submit', (event) => {
  const action = event.target.dataset.action;
  if (action === 'auth-submit') {
    event.preventDefault();
    state.authenticated = true;
    localStorage.setItem('ncn.authenticated', 'true');
    if (!state.activeChatId && innerWidth > 850) selectChat(state.chats[0]?.id, false);
    render();
  }
  if (action === 'send-message') {
    event.preventDefault();
    const textarea = event.target.querySelector('textarea');
    sendTextMessage(textarea?.value ?? '');
  }
});

app.addEventListener('dblclick', (event) => {
  if (state.selection.phase === 'selecting') return;
  const row = event.target.closest('.message-row');
  if (!row) return;
  const message = activeMessages().find((item) => String(item.id) === String(row.dataset.messageId));
  if (message && message.type !== 'system') {
    state.replyDraft = { ...message };
    render();
  }
});

app.addEventListener('click', async (event) => {
  const row = event.target.closest('.message-row');
  if (row && !event.target.closest('button')) handleMessageClick(event, row);

  const chatButton = event.target.closest('[data-chat-id]');
  if (chatButton) selectChat(chatButton.dataset.chatId);

  const filter = event.target.closest('[data-chat-filter]');
  if (filter) { state.chatFilter = filter.dataset.chatFilter; render(); }

  const overlayButton = event.target.closest('[data-open-overlay]');
  if (overlayButton) openOverlay(overlayButton.dataset.openOverlay);

  const target = event.target.closest('[data-forward-target]');
  if (target) await handleForwardTarget(target.dataset.forwardTarget);

  const actionElement = event.target.closest('[data-action]');
  const action = actionElement?.dataset.action;
  switch (action) {
    case 'auth-toggle': state.authMode = state.authMode === 'login' ? 'register' : 'login'; render(); break;
    case 'back-to-list': openChatList(); break;
    case 'selection-clear': clearSelection('CLEAR'); break;
    case 'selection-copy': await handleCopySelection(); break;
    case 'selection-forward': openOverlay('forward'); break;
    case 'selection-delete': await handleDeleteSelection(); break;
    case 'selection-pin': await handlePinSelection(); break;
    case 'overlay-close': closeOverlay(); break;
    case 'reply-cancel': state.replyDraft = null; render(); break;
    case 'voice-start': await startVoiceRecording(); break;
    case 'voice-start-overlay': closeOverlay(); await startVoiceRecording(); break;
    case 'voice-cancel': cancelVoice(); render(); break;
    case 'voice-stop': await stopVoiceAndSend(); break;
    case 'emoji': {
      const chat = activeChat(); if (!chat) break;
      state.draftByChat[chat.id] = `${state.draftByChat[chat.id] ?? ''} ⚡`; saveDrafts(); render();
      requestAnimationFrame(() => document.querySelector('[data-role="composer-input"]')?.focus()); break;
    }
    case 'toggle-effects': state.settings.effects = !state.settings.effects; localStorage.setItem('ncn.effects', String(state.settings.effects)); render(); break;
    case 'toggle-compact': state.settings.compact = !state.settings.compact; localStorage.setItem('ncn.compact', String(state.settings.compact)); render(); break;
    case 'toggle-receipts': state.settings.readReceipts = !state.settings.readReceipts; localStorage.setItem('ncn.receipts', String(state.settings.readReceipts)); render(); break;
    case 'open-downloads': openOverlay('downloads'); break;
    case 'open-invites': openOverlay('invites'); break;
    case 'open-media': openOverlay('media'); break;
    case 'open-message-search': openOverlay('message-search'); break;
    case 'logout':
      operations.cancelAll(); cancelVoice('logout'); unsubscribeMessages?.(); state.selection = selectionReducer(state.selection, { type: 'LOGOUT' }); state.authenticated = false; state.activeChatId = null; state.overlay = null; localStorage.removeItem('ncn.authenticated'); render(); break;
    case 'copy-invite': await writeClipboard('NCN-7F2A-19C0'); toast('Код приглашения скопирован'); break;
    case 'attachment-demo': toast('Модуль вложений подготовлен', 'Для production подключается Capacitor File Picker и Firebase Storage.'); break;
    case 'ice-demo': toast('ICE-контейнер', 'В production нужен отдельный криптографический протокол и серверная валидация.'); break;
    case 'security-info': toast('Контур безопасности', 'Клиентские capabilities должны дублироваться Firestore Rules.'); break;
    case 'danger-info': toast('Операция заблокирована', 'В демо массовое удаление доступно через выделение сообщений.'); break;
    case 'invite-action': toast('Заявка обработана', 'Демо-режим: серверная запись не выполнена.'); break;
    case 'contact-open': closeOverlay(); toast('Новый диалог', 'Демо-контакт выбран.'); break;
    case 'play-voice': toast('Воспроизведение', 'В демо нет аудиофайла.'); break;
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    operations.cancelAll();
    state.selection = selectionReducer(state.selection, { type: 'BACKGROUND' });
    cancelVoice('background');
    render();
  }
});

window.addEventListener('online', () => { state.networkState = 'online'; render(); toast('Сеть восстановлена', 'Синхронизация продолжена.'); });
window.addEventListener('offline', () => { state.networkState = 'offline'; render(); toast('Нет соединения', 'Черновики и кэш остаются доступны.', 'error'); });
window.addEventListener('beforeunload', () => { unsubscribeMessages?.(); operations.cancelAll(); cancelVoice('unload'); });

initialize().catch((error) => {
  app.innerHTML = `<div class="empty-state"><div class="empty-core"><div class="empty-title">Не удалось запустить Night City Net</div><div class="empty-text">${escapeHtml(error.message)}</div></div></div>`;
});

</script>
</body>
</html>
