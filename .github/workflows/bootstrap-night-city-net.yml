name: Bootstrap Night City Net review branch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .bootstrap/ready

permissions:
  contents: write

concurrency:
  group: bootstrap-night-city-net-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  unpack-reviewed-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/night-city-net-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated review branch
        uses: actions/checkout@v4
        with:
          ref: agent/night-city-net-foundation
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/chunk-00
          test -f .bootstrap/chunk-07
          cat .bootstrap/chunk-* | base64 --decode > /tmp/night-city-net-source.tar.gz
          echo '59da07abf054f6be923ccef574e6161a130045eab55fe692b010ebd87a940fee  /tmp/night-city-net-source.tar.gz' | sha256sum --check
          gzip -t /tmp/night-city-net-source.tar.gz
          tar -tzf /tmp/night-city-net-source.tar.gz > /tmp/archive-files.txt
          if grep -Eq '(^|/)\.git(/|$)|(^|/)\.github/workflows/bootstrap-night-city-net\.yml$' /tmp/archive-files.txt; then
            echo 'Unsafe archive entry detected' >&2
            exit 1
          fi
          tar -xzf /tmp/night-city-net-source.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit unpacked project to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'add Night City Net foundation'
          git push origin HEAD:agent/night-city-net-foundation
