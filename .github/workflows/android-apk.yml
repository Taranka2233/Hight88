name: Verify and build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test and verify web bundle
        run: npm run check
      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Set version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 1/' android/app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "0.1.0"/' android/app/build.gradle
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: night-city-net-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
